# OpenMyGlass: checks for our changes to the 4.4 build system. The full AOSP build runs from
# OpenMyGlass/manifest.
name: check
on:
  push:
    branches: [glass-4.4]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: ARMv7-A NEON flags per CPU variant
        run: sh tests/test_armv7_a_neon.sh
