# SPDX-License-Identifier: Apache-2.0
# OpenMyGlass: checks for our changes to the 6.0 build system. The full AOSP build runs from
# OpenMyGlass/manifest's android-6.0.xml, a file on main.
name: check
on:
  push:
    branches: [glass-6.0]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch the upstream branch the cherry-picks come from
        run: git fetch -q --no-tags https://github.com/omap4-aosp/android_build.git +refs/heads/aosp-6.0:refs/upstream/aosp-6.0
      - name: Only unchanged cherry-picks on top of AOSP
        run: sh tests/check_cherry_picks.sh 5806573811f023427012329248759979800686be refs/upstream/aosp-6.0
      - name: Shell scripts
        run: shellcheck -s sh tests/*.sh
      - name: Tests
        run: for t in tests/test_*.sh; do sh "$t" || exit 1; done
